name: Local source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/scripts/test-native-ci-apt-mirrors.py
      - run: npm ci
      - run: npm run test:structures
      - run: npm run test:native-ai
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: python -m pip install -r scripts/local-core-requirements.txt
      - run: python scripts/build-local-core.py --check-sources
      - run: python -m unittest discover -s backend/tests -v
        env:
          PYTHONPATH: .
      - run: git diff --check
