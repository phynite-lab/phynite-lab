name: Announce Release to Discord

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to announce (e.g. v0.1.10)'
        required: false
        type: string
      summary:
        description: 'Custom message/summary line (optional)'
        required: false
        type: string
      mention_everyone:
        description: 'Mention @everyone in announcement'
        required: false
        type: boolean
        default: true
      dry_run:
        description: 'Dry run (preview payload without sending to Discord)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  announce:
    if: github.repository == 'phynite-lab/phynite-lab'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Broadcast release to Discord announcements
        env:
          DISCORD_ANNOUNCEMENTS_WEBHOOK: ${{ secrets.DISCORD_ANNOUNCEMENTS_WEBHOOK }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_SUMMARY: ${{ inputs.summary }}
          INPUT_MENTION_EVERYONE: ${{ inputs.mention_everyone == false && 'false' || 'true' }}
          INPUT_DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}
        run: |
          node scripts/announce-release.mjs
