[package]
name = "phynite-lab-desktop"
version = "0.1.33"
edition = "2021"
license = "AGPL-3.0-only"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSAccessibility", "NSAppearance", "NSBox", "NSButton", "NSButtonCell", "NSColor", "NSControl", "NSFont", "NSFontDescriptor", "NSGraphics", "NSResponder", "NSText", "NSTextField", "NSView", "NSWindow", "NSWorkspace", "objc2-core-graphics", "objc2-quartz-core"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSGeometry", "NSLocale", "NSObject", "NSString", "NSUserDefaults", "NSValue"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CAAnimation", "CABase", "CALayer", "CAMediaTiming", "CAMediaTimingFunction", "CATransaction", "objc2-core-graphics"] }
